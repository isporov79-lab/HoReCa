<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вода — HoReCaDrinks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="#00db99"/>
          <path d="M12 28V12h4l8 10V12h4v16h-4l-8-10v10h-4z" fill="#121212"/>
        </svg>
        <span class="logo-text">HoReCa<span class="logo-accent">Drinks</span></span>
      </a>
      <nav class="nav">
        <a href="index.html#categories">Категории</a>
        <a href="index.html#segments">Сегменты</a>
        <a href="index.html#conditions">Условия</a>
        <a href="index.html#faq">FAQ</a>
        <a href="index.html#contacts">Контакты</a>
      </nav>
      <div class="header-actions">
        <a href="tel:+74950000000" class="header-phone"><i class="fas fa-phone"></i> +7 (495) 000-00-00</a>

        <!-- Кнопка корзины -->
        <button class="header-cart" id="cart-button" aria-label="Открыть корзину">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-text">Корзина</span>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section excel-products-section">
      <div class="container">
        <h1 class="section-title">Вода</h1>
        <p class="section-subtitle">Негазированная и газированная вода для HoReCa.</p>
        <div class="subcategory-filters">
          <button class="subcategory-btn active" data-subcategory="">Все</button>
          <button class="subcategory-btn" data-subcategory="С газом">С газом</button>
          <button class="subcategory-btn" data-subcategory="Без газа">Без газа</button>
          <button class="subcategory-btn" data-subcategory="Со вкусом">Со вкусом</button>
        </div>
        <div class="excel-products-grid" data-excel-products data-excel-category="Вода"></div>
      </div>
    </section>
  </main>
  
  <!-- Боковая корзина -->
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-panel">
      <div class="cart-header">
        <h2>Ваша корзина</h2>
        <button class="cart-close" id="cart-close">&times;</button>
      </div>
      <button class="cart-clear" id="cart-clear">Очистить корзину</button>
      <div class="cart-items" id="cart-items">
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Итого:</span>
          <span class="cart-total-right">
            <span id="cart-total-price">0 ₽</span>
            <span class="cart-total-vat">Цена с НДС</span>
          </span>
        </div>
        <form id="order-form" class="order-form">
          <input type="text" name="name" placeholder="Ваше имя" required>
          <input type="tel" name="phone" placeholder="Телефон" required>
          <button type="submit" class="btn btn-primary btn-block">Отправить заказ</button>
          <div id="order-feedback" class="order-feedback"></div>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer" id="contacts">
    <div class="container">
      <div class="footer-bottom">
        <p>© <span class="copyright-year"></span> HoReCaDrinks. Все права защищены.</p>
        <p><a href="index.html">Вернуться на главную</a></p>
      </div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
  <script src="js/catalog-data.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
