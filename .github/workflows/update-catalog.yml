name: Update catalog and photos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas requests

      - name: Download photos from Yandex Disk
        run: |
          python scripts/update_catalog.py

      - name: Convert Excel to catalog JSON
        run: |
          python convert_catalog.py

      - name: Save updated catalog and photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json
          git add js/catalog-data.js
          git add assets/img/products
          git add -f assets/files/products.xlsx

          git diff --cached --quiet || git commit -m "Update catalog and product photos"

          git pull --rebase origin main

          git push origin main
