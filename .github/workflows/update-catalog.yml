name: Update catalog and photos

on:
  push:
    paths:
      - "catalog.xlsx"
      - "scripts/update_catalog.py"
      - "convert_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests pandas

      - name: Download photos from Yandex Disk
        run: python scripts/update_catalog.py

      - name: Convert Excel to catalog JSON
        run: python convert_catalog.py

      - name: Save updated catalog and photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json catalog.xlsx assets/img/products
          git diff --cached --quiet || git commit -m "Update catalog and product photos"
          git push
