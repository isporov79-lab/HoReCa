name: Update catalog from Excel

on:
  push:
    paths:
      - "catalog.xlsx"
      - "convert_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel reader
        run: pip install pandas openpyxl

      - name: Convert Excel
        run: python convert_catalog.py

      - name: Save generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json js/catalog-data.js
          git diff --cached --quiet || git commit -m "Update catalog from Excel"
          git push
