name: Update catalog and photos

on:
  push:
    paths:
      - "catalog.xlsx"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl requests

      - name: Prepare folders
        run: |
          mkdir -p assets/img/products
          mkdir -p assets/files
          mkdir -p js

      - name: Prepare Excel and download photos
        run: |
          python scripts/update_catalog.py

      - name: Convert Excel to catalog JSON and JS
        run: |
          python convert_catalog.py

      - name: Verify generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = Path("catalog.json")
          js = Path("js/catalog-data.js")

          if not catalog.exists():
              raise SystemExit("ОШИБКА: catalog.json не создан")
          if not js.exists():
              raise SystemExit("ОШИБКА: js/catalog-data.js не создан")

          data = json.loads(catalog.read_text(encoding="utf-8"))
          products = data.get("products", [])

          print(f"Товаров в каталоге: {len(products)}")

          if not products:
              raise SystemExit("ОШИБКА: каталог пуст")

          print("Каталог успешно создан.")
          PY

      - name: Verify local product images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          image_dir = Path("assets/img/products")

          missing = []

          for product in data.get("products", []):
              image = str(product.get("image", "") or "").strip()

              if not image:
                  continue

              if image.startswith(("http://", "https://")):
                  continue

              filename = Path(image).name
              if not (image_dir / filename).exists():
                  missing.append(filename)

          if missing:
              print("Не найдены фотографии:")
              for name in missing:
                  print(" -", name)
              raise SystemExit("ОШИБКА: отсутствуют локальные фотографии.")

          print("Все локальные фотографии найдены.")
          PY

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Нет изменений для сохранения."
            exit 0
          fi

          git commit -m "Update catalog from Excel"
          git push origin HEAD:main
