name: Update catalog and photos

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: update-catalog-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl pandas

      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Download photos from Yandex Disk
        run: |
          python scripts/update_catalog.py

      - name: Convert Excel to catalog JSON
        run: |
          python convert_catalog.py

      - name: Save updated catalog and photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json
          git add catalog.xlsx
          git add -f assets/files/products.xlsx
          git add -f assets/img/products

          if git diff --cached --quiet; then
            echo "Нет изменений для сохранения."
            exit 0
          fi

          git commit -m "Update catalog and product photos"

          git push origin HEAD:main
